server {
    server_tokens   off;

    listen 80;
    server_name _;

    location @movie_api {
        proxy_pass http://movie_api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /api {
        proxy_pass http://movie_api:8000;
    }
}