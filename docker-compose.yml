version: '3.7'
volumes:
  postgres_data:
  static_volume:
  es_data:


services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.14.0
    environment:
      - discovery.type=single-node
    restart: always
    volumes:
      - ./es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - ./redis_data:/data

  movie_api:
    build: .
    restart: always
    environment:
      - REDIS_HOST=redis
      - ELASTIC_HOST=elastic
      - PROJECT_LOG_LEVEL=warning
    depends_on:
      - redis
      - elastic

  nginx:
    image: nginx:1.19.3
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - movie_api
